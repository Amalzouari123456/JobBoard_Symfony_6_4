# Service
spring.application.name=candidat
server.port=8081

# Base H2 en memoire (chaque instance a ses propres donnees)
spring.datasource.url=jdbc:h2:mem:candidatdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Swagger : http://localhost:8081/swagger-ui.html
# Derriere la Gateway, l'URL du serveur Swagger est calculee a partir des en-tetes X-Forwarded-*
server.forward-headers-strategy=framework

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
