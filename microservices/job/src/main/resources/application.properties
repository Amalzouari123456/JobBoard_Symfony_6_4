# Service
spring.application.name=job
server.port=8082

# Base MySQL (XAMPP) - la base est creee automatiquement si elle n'existe pas
spring.datasource.url=jdbc:mysql://localhost:3306/jobdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger : http://localhost:8082/swagger-ui.html
# Derriere la Gateway, l'URL du serveur Swagger est calculee a partir des en-tetes X-Forwarded-*
server.forward-headers-strategy=framework

# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
